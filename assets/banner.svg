<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win">
      <rect x="100" y="150" width="1000" height="410" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="100" y="78" class="sans" font-size="42" font-weight="700" fill="#f0f6fc">🛒 silpo-agent-cli</text>
  <text x="102" y="110" class="sans" font-size="19" fill="#8b949e">Grocery shopping, scripted — a plain CLI over the Silpo MCP server, built for AI agents</text>

  <rect x="100" y="150" width="1000" height="410" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g clip-path="url(#win)">
    <rect x="100" y="150" width="1000" height="42" fill="#0d1117"/>
    <circle cx="130" cy="171" r="7" fill="#ff5f56"/>
    <circle cx="154" cy="171" r="7" fill="#ffbd2e"/>
    <circle cx="178" cy="171" r="7" fill="#27c93f"/>
    <text x="600" y="177" text-anchor="middle" class="mono" font-size="14" fill="#8b949e">zsh — silpo-agent</text>
  </g>

  <g class="mono" font-size="22" fill="#c9d1d9">
    <text x="130" y="240"><tspan fill="#3fb950">$</tspan> silpo-agent smart-cart --budget 1500</text>

    <text x="130" y="288" fill="#3fb950">✓ <tspan fill="#c9d1d9">Confirmed delivery address</tspan></text>
    <text x="130" y="324" fill="#3fb950">✓ <tspan fill="#c9d1d9">Added 14 typical items</tspan></text>
    <text x="130" y="360" fill="#3fb950">✓ <tspan fill="#c9d1d9">Added 3 favorited deals</tspan></text>
    <text x="130" y="396" fill="#3fb950">✓ <tspan fill="#c9d1d9">Norm top-up: +5 items</tspan></text>

    <text x="130" y="452" font-size="24" font-weight="700" fill="#d29922">Total: 1487.30 ₴  (22 items)</text>

    <text x="130" y="510" fill="#8b949e" font-size="18">$ <tspan fill="#58a6ff">|</tspan></text>
  </g>
</svg>
