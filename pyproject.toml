[project]
name = "silpo-agent-cli"
version = "0.1.0"
description = "Personal CLI wrapper over the Silpo MCP server"
readme = "README.md"
license = "MIT"
authors = [
    { name = "d.bilukcha", email = "siniidrozd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
]

[project.scripts]
silpo-agent = "silpo_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silpo_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
